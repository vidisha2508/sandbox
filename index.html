<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8" />

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    />

    <title>Sandbox</title>

</head>

<body>

    <div id="app">

        <!-- ========================= -->
        <!-- Toolbar -->
        <!-- ========================= -->

        <header id="toolbar">

            <div id="logo">

                <div class="logo-icon"></div>

                <div>

                    <h1>Sandbox</h1>

                    <p>Desktop Gesture Interface</p>

                </div>

            </div>

            <div id="actions">

                <button id="addCube">
                    Add Cube
                </button>

                <button id="deleteCube">
                    Delete Selected
                </button>

                <button id="resetScene">
                    Reset
                </button>

                <button id="modeToggle">
                    Individual
                </button>

                <button id="startCamera">
                    Start Camera
                </button>

            </div>

        </header>

        <!-- ========================= -->
        <!-- Workspace -->
        <!-- ========================= -->

        <main id="workspace">

            <!-- Camera -->

            <video
                id="cameraFeed"
                autoplay
                muted
                playsinline
            ></video>

            <!-- Hand Skeleton Overlay -->

            <canvas
                id="handCanvas"
            ></canvas>

            <!-- Three.js -->

            <div id="scene"></div>

            <!-- Status Panel -->

            <div id="statusPanel">

                <div class="statusCard">

                    Camera

                    <strong id="cameraStatus">

                        Off

                    </strong>

                </div>

                <div class="statusCard">

                    Gesture

                    <strong id="gestureStatus">

                        No Hand

                    </strong>

                </div>

                <div class="statusCard">

                    Mode

                    <strong id="modeText">

                        Individual

                    </strong>

                </div>

                <div class="statusCard">

                    Objects

                    <strong id="objectCount">

                        1

                    </strong>

                </div>

                <div class="statusCard">

                    FPS

                    <strong id="fps">

                        60

                    </strong>

                </div>

            </div>

        </main>

    </div>

    <script
        type="module"
        src="/src/main.js"
    ></script>

</body>

</html>
