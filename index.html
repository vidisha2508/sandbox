<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    />

    <link rel="icon" type="image/png" href="/logo.png">
    <title>Sandbox</title>
</head>

<body>

    <div id="app">

        <main id="workspace">

            <header id="toolbar">

                <div id="logo">
                    <img src="/logo.png" class="logo-icon">

                    <div>
                        <h1>Sandbox</h1>
                        <p>Gesture Based 3D Editor/p>
                    </div>
                </div>

                <div id="actions">

                    <button id="addCube">
                        Add Cube
                    </button>

                    <button id="deleteCube">
                        Delete Selected
                    </button>

                    <button id="resetScene">
                        Reset
                    </button>

                    <button id="modeToggle">
                        Individual
                    </button>

                    <button id="startCamera">
                        Start Camera
                    </button>

                </div>

            </header>

            <video
                id="cameraFeed"
                autoplay
                muted
                playsinline
            ></video>

            <canvas
                id="handCanvas"
            ></canvas>

            <div id="scene"></div>

            <div id="statusPanel">

                <div class="statusCard">
                    Camera
                    <strong id="cameraStatus">
                        Off
                    </strong>
                </div>

                <div class="statusCard">
                    Gesture
                    <strong id="gestureStatus">
                        No Hand
                    </strong>
                </div>

                <div class="statusCard">
                    Mode
                    <strong id="modeText">
                        Individual
                    </strong>
                </div>

                <div class="statusCard">
                    Objects
                    <strong id="objectCount">
                        1
                    </strong>
                </div>

                <div class="statusCard">
                    FPS
                    <strong id="fps">
                        60
                    </strong>
                </div>

            </div>

        </main>

    </div>

    <script
        type="module"
        src="/src/main.js"
    ></script>

</body>

</html>
